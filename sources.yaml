# Upstream catalogues to ingest.
#
# `path` resolves under `sources_root` from .env unless it is absolute or
# starts with `~`, so this file stays identical on every machine.
#
# `include` is a whitelist of skill directory names (fnmatch patterns). When
# present, nothing else from that source is taken. `exclude` is applied after.
# Both match the directory name, not the path.

sources:
  # Book-distilled lenses. Small, uniform, pure Markdown — the shape this
  # catalogue is built around. 62 skills upstream, whitelisted here: the
  # catalogue serves an architect writing milestones, specs and plans, so the
  # marketing, sales, persuasion and visual-craft halves of the upstream are
  # deliberately absent, and so are all 12 metaskills (create-*, improve-*,
  # grow-*, design-code-architecture, remove-technical-debt) — each is a
  # phase-by-phase journey keeping state in docs/, i.e. a second orchestrator
  # by its own description, under the same rule the ecc source states below.
  #
  # `path` is the upstream checkout, not ~/.claude/skills: the installed set is
  # whatever this machine happens to have, and a manifest that whitelists what
  # is not there fails silently.
  - label: wondelai
    path: wondelai-skills
    url: https://github.com/wondelai/skills
    license: MIT
    include:
      # Design and code craft. refactoring-patterns assumes tests already
      # exist; working-with-legacy-code is what a plan needs when they do not.
      - clean-architecture
      - clean-code
      - domain-driven-design
      - refactoring-patterns
      - working-with-legacy-code
      # Architecture core: scale, data, complexity, craft meta-principles, and
      # the team boundaries Conway's law makes an architectural concern.
      - system-design
      - ddia-systems
      - software-design-philosophy
      - pragmatic-programmer
      - team-topologies
      # Operability and interaction.
      - release-it
      - design-everyday-things
      - ux-heuristics
      # Strategy and product: what a milestone brief is made of — the honest
      # diagnosis, the job the product is hired for, the discovery that turns a
      # vague objective into opportunities, and the appetite that bounds it.
      - good-strategy-bad-strategy
      - inspired-product
      - jobs-to-be-done
      - continuous-discovery
      - lean-startup
      - 37signals-way

  # ECC is an agent harness — 281 skills, 67 agents, 94 commands, with its own
  # plan/test/implement/review loop. It is mined, not adopted: a whitelist here
  # is the difference between borrowing a vocabulary and installing a second
  # orchestrator. Add names deliberately, after reading them.
  - label: ecc
    path: affan-m-ecc/skills
    url: https://github.com/affaan-m/ECC
    license: MIT
    include:
      - api-design
      - architecture-decision-records
      - accessibility
      # Second batch, chosen against the lens/pipeline rule and this project's
      # stack. Everything named for a workflow (orch-*, *-tdd, *-verification,
      # tdd-workflow, verification-loop) is a pipeline by its own title and is
      # deliberately absent.
      - hexagonal-architecture
      - error-handling
      - postgres-patterns
      - regex-vs-llm-structured-text
      - mcp-server-patterns
      # Third batch: this project's actual stack — FastAPI and Postgres on the
      # back, Vite and React in DevTools. django-* is a different stack, and
      # django-tdd / django-verification are pipelines by their own titles.
      - fastapi-patterns
      - python-patterns
      - python-testing
      - react-patterns
      - react-performance
      - vite-patterns

  - label: wispbit
    path: wispbit-ai-skills/skills
    url: https://github.com/wispbit/ai-skills
    license: MIT

  # Three focused skills, one rule per file, frontmatter written for machine
  # consumption (title/impactDescription/tags) — taken whole, same as wondelai
  # and wispbit above.
  - label: ludo
    path: ludo-technologies_python-best-practices/skills
    url: https://github.com/ludo-technologies/python-best-practices
    license: MIT
