summary: A framework for structuring software around the Dependency Rule — source code dependencies
  point inward from frameworks to use cases to entities — with scoring criteria, layer definitions,
  component principles, SOLID principles, boundary patterns, and a diagnostic checklist.
decomposed_by: xiaomi/mimo-v2.5
parts:
- id: scoring-and-diagnostic
  title: Architecture Scoring and Quick Diagnostic
  applies_to: Use when evaluating how well an existing or proposed architecture follows the
    Dependency Rule and you need a scoring rubric with actionable yes/no diagnostic questions.
  kind: lens
  preamble_spans:
  - - 14
    - 16
  spans:
  - - 18
    - 20
  - - 176
    - 186
